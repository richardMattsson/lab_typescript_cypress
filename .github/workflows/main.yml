name: Cypress Tests

on: push

jobs:
  cypress-run:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Start backend server
        working-directory: backend
        run: npm run dev &
        env:
          PGURI: ${{ secrets.PGURI }}

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          build: npm run build
          start: npm run dev

      - name: Generate merged coverage
        working-directory: frontend
        run: |
          npx nyc merge coverage .nyc_output/out.json
          npx nyc report --reporter=json-summary --report-dir ./

      - name: Upload code coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./frontend/coverage-summary.json

      - name: Update code coverage badge
        working-directory: frontend
        run: npx update-badge --coverage-source ./coverage-summary.json

      - name: Mirror frontend README to root
        run: cp frontend/README.md README.md

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
