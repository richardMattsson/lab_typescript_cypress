name: Cypress Tests

on: push

jobs:
  cypress-run:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Initialize database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d testdb -f frontend/init.sql

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Start backend server
        working-directory: backend
        run: npm run dev &
        env:
          PGURI: postgresql://postgres:postgres@localhost:5432/testdb

      - name: Cypress run
        uses: cypress-io/github-action@v6
        env:
          PGURI: postgresql://postgres:postgres@localhost:5432/testdb
        with:
          working-directory: frontend
          build: npm run build
          start: npm run dev

      - name: Run component tests
        working-directory: frontend
        run: npx cypress run --component

      - name: Update code coverage badge
        working-directory: frontend
        run: npx update-badge

      - name: Generate merged coverage
        working-directory: frontend
        run: |
          mkdir -p coverage/html coverage/temp
          npx nyc merge .nyc_output coverage/temp/merged.json
          npx nyc report --reporter=html --report-dir=coverage/html --temp-dir=coverage/temp

      - name: Upload code coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./frontend/coverage/html

      - name: Mirror frontend README to root
        run: cp frontend/README.md README.md

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
