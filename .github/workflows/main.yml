name: Cypress Tests

on: push

jobs:
  cypress-run:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Install npm dependencies, cache them correctly
      # and run all Cypress tests
      - name: Cypress run
        uses: cypress-io/github-action@v6
        # env:
        #   PGURI: ${{ secrets.PGURI }}
        with:
          working-directory: frontend
          build: npm run build
          start: npm run dev
          spec: cypress/e2e/products-exist.cy.ts
